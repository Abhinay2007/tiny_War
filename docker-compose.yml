services:
  tiny-army:
    build:
      context: .
      dockerfile: Dockerfile
    image: tiny-army:local
    init: true
    env_file:
      - .env
    environment:
      PORT: "7860"
      TINY_DATA_DIR: /data
    ports:
      - "${TINY_ARMY_HOST_PORT:-7860}:7860"
    volumes:
      - tiny-army-data:/data
    restart: unless-stopped

volumes:
  tiny-army-data:
